# Builds the installers on a version tag (0.1.0 or v0.1.0) and attaches them to that tag's
# GitHub release, or to a new draft release if there is none yet.
# A manual run builds them without releasing.
# Build infrastructure only; not part of the app's offline guarantee (ADR section 11).
name: Release
on:
  push:
    tags: ['v*', '[0-9]*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: darwin-arm64, builder: '--mac dmg:arm64' }
          - { os: macos-15-intel, target: darwin-x64, builder: '--mac dmg:x64' }
          - { os: windows-latest, target: win32-x64, builder: '--win nsis:x64' }
    runs-on: ${{ matrix.os }}
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Tag must match the package.json version
        if: github.ref_type == 'tag'
        shell: bash
        run: test "$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME#v}"
      - run: npm ci

      # Apple silicon takes the device tools from pinned Homebrew bottles (vendor.lock.json).
      # The other two platforms have none, so the tools are installed here and handed to
      # scripts/fetch-vendor.ts through VENDOR_TOOLS_DIR.
      - name: Install the device tools (Intel Mac, Homebrew)
        if: matrix.target == 'darwin-x64'
        run: |
          brew install libimobiledevice
          echo "VENDOR_TOOLS_DIR=$(brew --cellar)" >> "$GITHUB_ENV"
      - name: Set up MSYS2 (Windows)
        if: matrix.target == 'win32-x64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make diffutils
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-openssl mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-libplist mingw-w64-ucrt-x86_64-libimobiledevice-glue mingw-w64-ucrt-x86_64-libusbmuxd
      # MSYS2 only packages libimobiledevice 1.3.0, so 1.4.0 is built from its release tarball
      # against MSYS2's libraries.
      - name: Build the device tools and stage them with the DLLs they load (Windows)
        if: matrix.target == 'win32-x64'
        shell: msys2 {0}
        run: |
          stage="$(cygpath -u "$RUNNER_TEMP")/device-tools"
          mkdir -p "$stage/licenses"
          cd "$(cygpath -u "$RUNNER_TEMP")"
          build() {
            local name=$1 version=$2 sha256=$3; shift 3
            curl -sSLO "https://github.com/libimobiledevice/$name/releases/download/$version/$name-$version.tar.bz2"
            echo "$sha256 *$name-$version.tar.bz2" | sha256sum -c -
            tar -xjf "$name-$version.tar.bz2"
            (cd "$name-$version" && ./configure --prefix=/ucrt64 "$@" && make -j4 && make install)
            echo "$name $version (built from the release tarball)" >> "$stage/PACKAGES.txt"
          }
          build libtatsu 1.1.1 18f471f131c1d55ccc02fa09565d870030c6ce92f737b89fe1b3849941ebb303
          build libimobiledevice 1.4.0 23cc0077e221c7d991bd0eb02150a0d49199bcca1ddf059edccee9ffd914939d --without-cython

          for tool in idevice_id idevicepair ideviceinfo idevicebackup2; do cp "/ucrt64/bin/$tool.exe" "$stage/"; done
          ldd "$stage"/*.exe | awk '$3 ~ /^\/ucrt64\// { print $3 }' | sort -u | xargs cp -t "$stage"
          # Ship each MSYS2 package's own licence files and record the exact versions.
          # (The two libraries built above belong to no package; LGPL-2.1 already ships with the app.)
          for file in "$stage"/*.dll; do pacman -Qqo "/ucrt64/bin/$(basename "$file")" 2>/dev/null || true; done | sort -u > "$stage/packages"
          while read -r pkg; do
            pacman -Q "$pkg" >> "$stage/PACKAGES.txt"
            pacman -Qlq "$pkg" | { grep '/share/licenses/.*[^/]$' || true; } | while read -r f; do
              install -D "$f" "$stage/licenses/${f#*/share/licenses/}"
            done
          done < "$stage/packages"
          rm "$stage/packages"
          cat "$stage/PACKAGES.txt"
          ls -R "$stage"
          echo "VENDOR_TOOLS_DIR=$(cygpath -w "$stage")" >> "$(cygpath -u "$GITHUB_ENV")"

      - run: npm run licenses
      - run: npx tsx scripts/fetch-vendor.ts ${{ matrix.target }}
      - run: npx electron-vite build
      - name: The built app starts and runs the bundled device tool
        if: runner.os == 'macOS'
        run: npx playwright test tests/e2e/real.spec.ts
      - run: npx electron-builder ${{ matrix.builder }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # A release made on github.com already exists when its tag arrives here.
      - run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
